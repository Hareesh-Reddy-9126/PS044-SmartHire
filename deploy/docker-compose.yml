# SmartHire Inc 0 — local demonstration stack.
# Proves: client → API gateway (8080) → Eureka discovery → job-service → GET /api/v1/jobs.
#
# Run from the repository root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
#
# Secrets come from deploy/.env (git-ignored). Required vars fail fast if unset (${VAR:?...}).
name: smarthire-inc0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smarthire}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
    # Not published to the host: reached only by job-service on the internal network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  service-registry:
    build:
      context: ..
      dockerfile: services/service-registry/Dockerfile
    environment:
      EUREKA_INSTANCE_HOSTNAME: service-registry
    ports:
      - "8761:8761" # Eureka dashboard, visible for the demo
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  job-service:
    build:
      context: ..
      dockerfile: services/job-service/Dockerfile
    environment:
      # Inc-0 simplification: job-service uses the shared Postgres app user. Per-schema
      # least-privilege DB users are deferred to Inc 3, when multiple schemas coexist.
      JOB_SVC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smarthire}
      JOB_SVC_DB_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in deploy/.env}
      JOB_SVC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
    # Not published to the host: reachable only via the gateway (that is the point of the demo).
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080" # the single public entry point
    depends_on:
      service-registry:
        condition: service_healthy
      job-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
