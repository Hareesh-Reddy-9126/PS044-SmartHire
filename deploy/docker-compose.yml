# SmartHire Inc 0 + Inc 1 — local demonstration stack.
# Inc 0 proves: client → API gateway (8080) → Eureka discovery → job-service → GET /api/v1/jobs.
# Inc 1 adds: auth-service (JWT issuance + JWKS) and Redis (refresh-token store + jti denylist),
# with the gateway enforcing edge authentication, revocation and rate limiting (AC-1).
#
# Run from the repository root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
#
# Secrets come from deploy/.env (git-ignored). Required vars fail fast if unset (${VAR:?...}).
name: smarthire

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smarthire}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
    # Not published to the host: reached only by job-service on the internal network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    # Inc 1: backs the refresh-token store and the shared JWT jti denylist (revoked:jti:*).
    # Not published to the host: reached only by auth-service and the gateway on the internal
    # network. Local demo runs without a Redis password; hardening is deferred with the DB users.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  service-registry:
    build:
      context: ..
      dockerfile: services/service-registry/Dockerfile
    environment:
      EUREKA_INSTANCE_HOSTNAME: service-registry
    ports:
      - "8761:8761" # Eureka dashboard, visible for the demo
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  job-service:
    build:
      context: ..
      dockerfile: services/job-service/Dockerfile
    environment:
      # Inc-0 simplification: job-service uses the shared Postgres app user. Per-schema
      # least-privilege DB users are deferred to Inc 3, when multiple schemas coexist.
      JOB_SVC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smarthire}
      JOB_SVC_DB_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in deploy/.env}
      JOB_SVC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
    # Not published to the host: reachable only via the gateway (that is the point of the demo).
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    environment:
      # Inc-1 simplification: auth-service uses the shared Postgres app user and creates its own
      # auth_svc schema via Flyway. Per-schema least-privilege DB users are deferred to Inc 3.
      AUTH_SVC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smarthire}
      AUTH_SVC_DB_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in deploy/.env}
      AUTH_SVC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      REDIS_HOST: redis
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      # Local profile explicitly permits an ephemeral dev keypair; production requires a key.
      AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:-}
      # "seed" activates the RECRUITER/ADMIN seeder; it only creates an account when both the email
      # and password below are supplied via deploy/.env (blank => that account is skipped).
      SPRING_PROFILES_ACTIVE: local,seed
      AUTH_SEED_RECRUITER_EMAIL: ${AUTH_SEED_RECRUITER_EMAIL:-}
      AUTH_SEED_RECRUITER_PASSWORD: ${AUTH_SEED_RECRUITER_PASSWORD:-}
      AUTH_SEED_ADMIN_EMAIL: ${AUTH_SEED_ADMIN_EMAIL:-}
      AUTH_SEED_ADMIN_PASSWORD: ${AUTH_SEED_ADMIN_PASSWORD:-}
    # Not published to the host: reachable only via the gateway. The gateway fetches JWKS over the
    # internal network (GATEWAY_JWK_SET_URI below), not through a published port.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Inc 1: edge revocation reads the shared denylist from Redis; the reactive JWT decoder
      # fetches auth-service's JWKS directly over the internal network (a plain URL, not lb://).
      REDIS_HOST: redis
      GATEWAY_JWK_SET_URI: http://auth-service:8082/oauth2/jwks
    ports:
      - "8080:8080" # the single public entry point
    depends_on:
      service-registry:
        condition: service_healthy
      job-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
