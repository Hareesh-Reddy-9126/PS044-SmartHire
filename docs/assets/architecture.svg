<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="690" viewBox="0 0 1360 690" role="img" aria-label="SmartHire microservice architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f19"/>
      <stop offset="55%" stop-color="#07130f"/>
      <stop offset="100%" stop-color="#040c09"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14312a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d221b" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#173a30"/>
      <stop offset="50%" stop-color="#1d4a3c"/>
      <stop offset="100%" stop-color="#173a30"/>
    </linearGradient>
    <linearGradient id="cylTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b4437"/>
      <stop offset="100%" stop-color="#123027"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="rgba(200,161,101,0.06)" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c8a165"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(200,161,101,0.55)"/>
    </marker>
  </defs>

  <rect width="1360" height="690" fill="url(#bg)"/>
  <rect width="1360" height="690" fill="url(#grid)"/>
  <ellipse cx="640" cy="20" rx="560" ry="230" fill="rgba(47,93,78,0.16)"/>
  <ellipse cx="1120" cy="640" rx="380" ry="200" fill="rgba(200,161,101,0.07)"/>

  <text x="36" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="3.5" fill="#c8a165" font-weight="700">SYSTEM ARCHITECTURE</text>
  <text x="36" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#f4efe4">One edge, seven services, isolated data.</text>

  <!-- Browser -->
  <g filter="url(#soft)">
    
    <g>
      <rect x="43" y="127" width="320" height="92" rx="12" fill="#03100b" opacity="0.55"/>
      <rect x="36" y="120" width="320" height="92" rx="12" fill="url(#card)" stroke="rgba(200,161,101,0.28)" stroke-width="1"/>
      <rect x="36" y="120" width="320" height="3" rx="1.5" fill="#c8a165" opacity="0.85"/>
      <text x="51" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#f4efe4">React SPA</text>
      <text x="51" y="177" font-family="Consolas, monospace" font-size="10.5" fill="#93a89d">Vite · TypeScript · Tailwind</text>
    </g>
  </g>
  <!-- Gateway -->
  <g filter="url(#soft)">
    <rect x="452" y="127" width="470" height="92" rx="12" fill="url(#bar)" stroke="rgba(200,161,101,0.55)" stroke-width="1.4"/>
    <rect x="452" y="127" width="470" height="3" rx="1.5" fill="#c8a165"/>
    <text x="476" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#f4efe4">API Gateway</text>
    <text x="476" y="186" font-family="Consolas, monospace" font-size="11" fill="#a9c3b5">JWT verification · routing · rate limits · CORS</text>
    <circle cx="884" cy="173" r="9" fill="none" stroke="#c8a165" stroke-width="1.6"/>
    <path d="M 879 173 l 4 4 l 7 -8" fill="none" stroke="#c8a165" stroke-width="1.8"/>
  </g>

  <!-- Client -> Gateway -->
  <path d="M 356 166 H 444" stroke="#c8a165" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- Gateway -> service bus -->
  <path d="M 687 219 V 262" stroke="#c8a165" stroke-width="1.6"/>
  <path d="M 123.5 262 H 1233.5" stroke="rgba(200,161,101,0.55)" stroke-width="1.6"/>
  <path d="M 123.5 262 V 330" stroke="rgba(200,161,101,0.42)" stroke-width="1.3"/><circle cx="123.5" cy="330" r="2.8" fill="#c8a165"/><path d="M 308.5 262 V 330" stroke="rgba(200,161,101,0.42)" stroke-width="1.3"/><circle cx="308.5" cy="330" r="2.8" fill="#c8a165"/><path d="M 493.5 262 V 330" stroke="rgba(200,161,101,0.42)" stroke-width="1.3"/><circle cx="493.5" cy="330" r="2.8" fill="#c8a165"/><path d="M 678.5 262 V 330" stroke="rgba(200,161,101,0.42)" stroke-width="1.3"/><circle cx="678.5" cy="330" r="2.8" fill="#c8a165"/><path d="M 863.5 262 V 330" stroke="rgba(200,161,101,0.42)" stroke-width="1.3"/><circle cx="863.5" cy="330" r="2.8" fill="#c8a165"/><path d="M 1048.5 262 V 330" stroke="rgba(200,161,101,0.42)" stroke-width="1.3"/><circle cx="1048.5" cy="330" r="2.8" fill="#c8a165"/><path d="M 1233.5 262 V 330" stroke="rgba(200,161,101,0.42)" stroke-width="1.3"/><circle cx="1233.5" cy="330" r="2.8" fill="#c8a165"/>

  <!-- Services -->
  <g filter="url(#soft)">
    <g>
      <rect x="43" y="337" width="175" height="84" rx="12" fill="#03100b" opacity="0.55"/>
      <rect x="36" y="330" width="175" height="84" rx="12" fill="url(#card)" stroke="rgba(200,161,101,0.28)" stroke-width="1"/>
      <rect x="36" y="330" width="175" height="3" rx="1.5" fill="#c8a165" opacity="0.85"/>
      <text x="51" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#f4efe4">auth-service</text>
      <text x="51" y="387" font-family="Consolas, monospace" font-size="10.5" fill="#93a89d">8082 · JWT · JWKS</text>
    </g>
    <g>
      <rect x="228" y="337" width="175" height="84" rx="12" fill="#03100b" opacity="0.55"/>
      <rect x="221" y="330" width="175" height="84" rx="12" fill="url(#card)" stroke="rgba(200,161,101,0.28)" stroke-width="1"/>
      <rect x="221" y="330" width="175" height="3" rx="1.5" fill="#7fa88f" opacity="0.85"/>
      <text x="236" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#f4efe4">job-service</text>
      <text x="236" y="387" font-family="Consolas, monospace" font-size="10.5" fill="#93a89d">8081 · postings</text>
    </g>
    <g>
      <rect x="413" y="337" width="175" height="84" rx="12" fill="#03100b" opacity="0.55"/>
      <rect x="406" y="330" width="175" height="84" rx="12" fill="url(#card)" stroke="rgba(200,161,101,0.28)" stroke-width="1"/>
      <rect x="406" y="330" width="175" height="3" rx="1.5" fill="#7fa88f" opacity="0.85"/>
      <text x="421" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#f4efe4">application-service</text>
      <text x="421" y="387" font-family="Consolas, monospace" font-size="10.5" fill="#93a89d">8083 · lifecycle</text>
    </g>
    <g>
      <rect x="598" y="337" width="175" height="84" rx="12" fill="#03100b" opacity="0.55"/>
      <rect x="591" y="330" width="175" height="84" rx="12" fill="url(#card)" stroke="rgba(200,161,101,0.28)" stroke-width="1"/>
      <rect x="591" y="330" width="175" height="3" rx="1.5" fill="#7fa88f" opacity="0.85"/>
      <text x="606" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#f4efe4">recruitment-service</text>
      <text x="606" y="387" font-family="Consolas, monospace" font-size="10.5" fill="#93a89d">8084 · interviews</text>
    </g>
    <g>
      <rect x="783" y="337" width="175" height="84" rx="12" fill="#03100b" opacity="0.55"/>
      <rect x="776" y="330" width="175" height="84" rx="12" fill="url(#card)" stroke="rgba(200,161,101,0.28)" stroke-width="1"/>
      <rect x="776" y="330" width="175" height="3" rx="1.5" fill="#7fa88f" opacity="0.85"/>
      <text x="791" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#f4efe4">document-service</text>
      <text x="791" y="387" font-family="Consolas, monospace" font-size="10.5" fill="#93a89d">8085 · storage</text>
    </g>
    <g>
      <rect x="968" y="337" width="175" height="84" rx="12" fill="#03100b" opacity="0.55"/>
      <rect x="961" y="330" width="175" height="84" rx="12" fill="url(#card)" stroke="rgba(200,161,101,0.28)" stroke-width="1"/>
      <rect x="961" y="330" width="175" height="3" rx="1.5" fill="#7fa88f" opacity="0.85"/>
      <text x="976" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#f4efe4">notification-service</text>
      <text x="976" y="387" font-family="Consolas, monospace" font-size="10.5" fill="#93a89d">8086 · delivery</text>
    </g>
    <g>
      <rect x="1153" y="337" width="175" height="84" rx="12" fill="#03100b" opacity="0.55"/>
      <rect x="1146" y="330" width="175" height="84" rx="12" fill="url(#card)" stroke="rgba(200,161,101,0.28)" stroke-width="1"/>
      <rect x="1146" y="330" width="175" height="3" rx="1.5" fill="#c8a165" opacity="0.85"/>
      <text x="1161" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#f4efe4">ai-service</text>
      <text x="1161" y="387" font-family="Consolas, monospace" font-size="10.5" fill="#93a89d">8087 · matching</text>
    </g></g>

  <!-- Services -> data bus -->
  <path d="M 123.5 452 H 1233.5" stroke="rgba(200,161,101,0.30)" stroke-width="1.1"/>
  <path d="M 123.5 414 V 452" stroke="rgba(200,161,101,0.30)" stroke-width="1.1"/><circle cx="123.5" cy="452" r="2.4" fill="#c8a165" opacity="0.8"/><path d="M 308.5 414 V 452" stroke="rgba(200,161,101,0.30)" stroke-width="1.1"/><circle cx="308.5" cy="452" r="2.4" fill="#c8a165" opacity="0.8"/><path d="M 493.5 414 V 452" stroke="rgba(200,161,101,0.30)" stroke-width="1.1"/><circle cx="493.5" cy="452" r="2.4" fill="#c8a165" opacity="0.8"/><path d="M 678.5 414 V 452" stroke="rgba(200,161,101,0.30)" stroke-width="1.1"/><circle cx="678.5" cy="452" r="2.4" fill="#c8a165" opacity="0.8"/><path d="M 863.5 414 V 452" stroke="rgba(200,161,101,0.30)" stroke-width="1.1"/><circle cx="863.5" cy="452" r="2.4" fill="#c8a165" opacity="0.8"/><path d="M 1048.5 414 V 452" stroke="rgba(200,161,101,0.30)" stroke-width="1.1"/><circle cx="1048.5" cy="452" r="2.4" fill="#c8a165" opacity="0.8"/><path d="M 1233.5 414 V 452" stroke="rgba(200,161,101,0.30)" stroke-width="1.1"/><circle cx="1233.5" cy="452" r="2.4" fill="#c8a165" opacity="0.8"/>
  <path d="M 520 452 V 536" stroke="rgba(200,161,101,0.5)" stroke-width="1.4" marker-end="url(#arrowDim)"/>

  <!-- auth-service -> Redis (refresh tokens + JWT denylist) -->
  <path d="M 123.5 414 V 486 H 900 V 536" fill="none" stroke="rgba(200,161,101,0.42)" stroke-width="1.2" stroke-dasharray="5 6" marker-end="url(#arrowDim)"/>
  <text x="135.5" y="480" font-family="Consolas, monospace" font-size="10" fill="#7e9688">auth-service · refresh tokens · JWT denylist</text>

  
  <g>
    <ellipse cx="520" cy="540" rx="112" ry="26" fill="#123027" stroke="rgba(200,161,101,0.35)"/>
    <rect x="408" y="540" width="224" height="56" fill="#0e241d"/>
    <ellipse cx="520" cy="596" rx="112" ry="26" fill="#0b1c16" stroke="rgba(200,161,101,0.25)"/>
    <ellipse cx="520" cy="540" rx="112" ry="26" fill="url(#cylTop)" stroke="rgba(200,161,101,0.5)"/>
    <text x="520" y="546" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#f4efe4">PostgreSQL 16</text>
    <text x="520" y="570" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#93a89d">one schema per service</text>
  </g>
  <g>
    <ellipse cx="900" cy="540" rx="96" ry="24" fill="#123027" stroke="rgba(200,161,101,0.35)"/>
    <rect x="804" y="540" width="192" height="50" fill="#0e241d"/>
    <ellipse cx="900" cy="590" rx="96" ry="24" fill="#0b1c16" stroke="rgba(200,161,101,0.25)"/>
    <ellipse cx="900" cy="540" rx="96" ry="24" fill="url(#cylTop)" stroke="rgba(200,161,101,0.5)"/>
    <text x="900" y="546" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#f4efe4">Redis 7</text>
    <text x="900" y="570" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#93a89d">refresh tokens · denylist</text>
  </g>


  <text x="36" y="666" font-family="Consolas, monospace" font-size="10.5" fill="#6f8779">OpenFeign + Resilience4j between services · Eureka discovery · correlation IDs on every hop</text>
</svg>
