<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SmartHire is an employment decision architecture: roles, applications, interviews, documents and decisions in one accountable record."
    />
    <meta name="theme-color" content="#0F271F" />
    <meta name="color-scheme" content="light" />
    <title>SmartHire — Employment decision architecture</title>
    <!--
      Web fonts are self-hosted from /fonts (see src/styles/fonts.css). They used to be linked
      from fonts.googleapis.com, which the production Content-Security-Policy blocks
      (style-src 'self', font-src 'self'): every icon then rendered as its literal ligature text.

      The icon font is preloaded because its ligatures become glyphs only after the file arrives:
      until then the spans are empty, which shifts the layout of icon+text rows on first paint.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/material-symbols-outlined.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
