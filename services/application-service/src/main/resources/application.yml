spring:
  application:
    name: application-service
  datasource:
    url: ${APP_SVC_DB_URL:jdbc:postgresql://localhost:5432/smarthire}
    username: ${APP_SVC_DB_USER:smarthire}
    # No default: the password must be supplied via the environment (governance §17 — no secrets in config).
    password: ${APP_SVC_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: application_svc
  flyway:
    enabled: true
    schemas: application_svc
    default-schema: application_svc
    create-schemas: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8083

# Resource-server JWT verification (ADR-0009, decision 4 — defense-in-depth behind the gateway).
# Mirrors the gateway's offline verification: keys are fetched from the auth-service JWKS over a
# direct HTTP URL (not lb://, the decoder's key fetch does not pass through the load balancer), and
# iss/aud are pinned to the values auth-service signs, so a token minted for another audience is
# rejected here too.
smarthire:
  application:
    jwt:
      jwk-set-uri: ${APP_JWK_SET_URI:http://localhost:8082/oauth2/jwks}
      issuer: ${AUTH_JWT_ISSUER:https://smarthire.local/auth}
      audience: ${AUTH_JWT_AUDIENCE:smarthire}


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

# Resilience4j configuration for fault tolerance on inter-service Feign calls.
# Named instances match the @CircuitBreaker/@Retry/@Bulkhead annotations on Feign clients.
#
# Aspect order: CircuitBreaker( Retry( Bulkhead( call ) ) ). Resilience4j's default puts Retry
# outermost, so the circuit breaker's fallback turns the first failure into a result and Retry
# never fires. Lower order = outer aspect; the bulkhead keeps its default (innermost).
#
# 4xx responses (FeignClientException) are answers, not outages: they are never retried and never
# counted as circuit-breaker failures.
resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    instances:
      jobService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 5s
        ignoreExceptions:
          - feign.FeignException$FeignClientException
      notificationService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 5s
        ignoreExceptions:
          - feign.FeignException$FeignClientException
  retry:
    retryAspectOrder: 2
    instances:
      jobService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
          - feign.FeignException
        ignoreExceptions:
          - feign.FeignException$FeignClientException
      notificationService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
          - feign.FeignException
        ignoreExceptions:
          - feign.FeignException$FeignClientException
  bulkhead:
    instances:
      jobService:
        maxConcurrentCalls: 20
        maxWaitDuration: 0
      notificationService:
        maxConcurrentCalls: 20
        maxWaitDuration: 0