# Local development profile for API Gateway
# Activates when 'local' profile is active: --spring.profiles.active=local

spring:
  cloud:
    gateway:
      routes:
        # Local development uses relaxed rate limits
        # Uses standard RedisRateLimiter (redisRateLimiter bean).
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@redisRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
        - id: application-service
          uri: lb://APPLICATION-SERVICE
          predicates:
            - Path=/api/v1/applications/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@redisRateLimiter}"
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
        - id: recruitment-service
          uri: lb://RECRUITMENT-SERVICE
          predicates:
            - Path=/api/v1/recruitments/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@redisRateLimiter}"
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 15
                redis-rate-limiter.burstCapacity: 30
                redis-rate-limiter.requestedTokens: 1
        - id: document-service
          uri: lb://DOCUMENT-SERVICE
          predicates:
            - Path=/api/v1/documents/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@redisRateLimiter}"
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

management:
  endpoints:
    web:
      exposure:
        # Local: expose all for development
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

# JWT configuration - local can use ephemeral keys
smarthire:
  gateway:
    jwt:
      jwk-set-uri: ${GATEWAY_JWK_SET_URI:http://localhost:8082/oauth2/jwks}
      issuer: ${AUTH_JWT_ISSUER:https://smarthire.local/auth}
      audience: ${AUTH_JWT_AUDIENCE:smarthire}