# Production profile overrides for API Gateway
# Activates when 'prod' profile is active: --spring.profiles.active=prod
#
# Routes are defined once in application.yml. Do NOT add a `spring.cloud.gateway.routes` list
# here: Spring config lists are replaced, not merged, so a profile-specific list silently dropped
# the job, notification, AI, JWKS and API-docs routes from the production gateway. Only the
# stricter production rate limits are overridden below; they are consumed by the placeholders in
# application.yml.

smarthire:
  gateway:
    rate-limits:
      auth:
        replenish: 5
        burst: 10
      application:
        replenish: 10
        burst: 20
      recruitment:
        replenish: 8
        burst: 16
      document:
        replenish: 5
        burst: 10
    # JWT configuration - production MUST provide explicit keys
    jwt:
      jwk-set-uri: ${GATEWAY_JWK_SET_URI}
      issuer: ${AUTH_JWT_ISSUER}
      audience: ${AUTH_JWT_AUDIENCE}

management:
  endpoints:
    web:
      exposure:
        # In production, only expose health and info publicly; prometheus behind auth
        include: health,info
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
