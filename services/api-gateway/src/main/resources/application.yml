spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      # Deny-by-default: no automatic discovery routes; only the explicit routes below are exposed
      # (architecture §3). Edge authentication/authorization is enforced by GatewaySecurityConfig.
      discovery:
        locator:
          enabled: false
      # Built-in hardening: adds X-Content-Type-Options, X-Frame-Options, HSTS, etc. to responses.
      default-filters:
        - SecureHeaders
      routes:
        # OpenAPI documentation routes (must come before service routes to avoid path conflicts)
        - id: job-service-api-docs
          uri: lb://JOB-SERVICE
          predicates:
            - Path=/v3/api-docs/job-service
          filters:
            - RewritePath=/v3/api-docs/job-service, /v3/api-docs
        - id: auth-service-api-docs
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - RewritePath=/v3/api-docs/auth-service, /v3/api-docs
        - id: application-service-api-docs
          uri: lb://APPLICATION-SERVICE
          predicates:
            - Path=/v3/api-docs/application-service
          filters:
            - RewritePath=/v3/api-docs/application-service, /v3/api-docs
        - id: recruitment-service-api-docs
          uri: lb://RECRUITMENT-SERVICE
          predicates:
            - Path=/v3/api-docs/recruitment-service
          filters:
            - RewritePath=/v3/api-docs/recruitment-service, /v3/api-docs
        - id: document-service-api-docs
          uri: lb://DOCUMENT-SERVICE
          predicates:
            - Path=/v3/api-docs/document-service
          filters:
            - RewritePath=/v3/api-docs/document-service, /v3/api-docs
        - id: notification-service-api-docs
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/v3/api-docs/notification-service
          filters:
            - RewritePath=/v3/api-docs/notification-service, /v3/api-docs
        # Job-service route. Public GET /api/v1/jobs/** for OPEN jobs; writes require RECRUITER.
        - id: job-service
          uri: lb://JOB-SERVICE
          predicates:
            - Path=/api/v1/jobs/**
        # JWKS endpoint route. Public access for JWT public key verification.
        - id: auth-service-jwks
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/oauth2/jwks
        # Auth-service route. GatewaySecurityConfig keeps register/login/refresh anonymous while
        # requiring a valid token for /me, /admin/whoami and /logout (deny-by-default, decision 6).
        # RequestRateLimiter throttles per client IP to blunt credential stuffing (decision 4).
        # Uses standard RedisRateLimiter (redisRateLimiter bean).
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@redisRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: ${smarthire.gateway.rate-limits.auth.replenish:10}
                redis-rate-limiter.burstCapacity: ${smarthire.gateway.rate-limits.auth.burst:20}
                redis-rate-limiter.requestedTokens: 1
        # Application-service route. All application endpoints require authentication (enforced by
        # GatewaySecurityConfig deny-by-default). Rate limiting applied to mutating operations.
        # Uses standard RedisRateLimiter (redisRateLimiter bean).
        - id: application-service
          uri: lb://APPLICATION-SERVICE
          predicates:
            - Path=/api/v1/applications/**
          filters:
            # Rate limit application submission (POST) and status changes (PATCH) per user
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@redisRateLimiter}"
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: ${smarthire.gateway.rate-limits.application.replenish:20}
                redis-rate-limiter.burstCapacity: ${smarthire.gateway.rate-limits.application.burst:40}
                redis-rate-limiter.requestedTokens: 1
            - name: SetResponseHeader
              args:
                name: X-RateLimit-Policy
                value: "user:20rps/40burst"
        # Recruitment-service route. All recruitment endpoints require authentication (enforced by
        # GatewaySecurityConfig deny-by-default). Rate limiting applied to mutating operations.
        # Uses standard RedisRateLimiter (redisRateLimiter bean).
        - id: recruitment-service
          uri: lb://RECRUITMENT-SERVICE
          predicates:
            - Path=/api/v1/recruitments/**
          filters:
            # Rate limit recruitment creation (POST) and status transitions (PATCH) per user
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@redisRateLimiter}"
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: ${smarthire.gateway.rate-limits.recruitment.replenish:15}
                redis-rate-limiter.burstCapacity: ${smarthire.gateway.rate-limits.recruitment.burst:30}
                redis-rate-limiter.requestedTokens: 1
            - name: SetResponseHeader
              args:
                name: X-RateLimit-Policy
                value: "user:15rps/30burst"
        # Document-service route. All document endpoints require authentication (enforced by
        # GatewaySecurityConfig deny-by-default). Rate limiting applied to uploads.
        # Uses standard RedisRateLimiter (redisRateLimiter bean).
        - id: document-service
          uri: lb://DOCUMENT-SERVICE
          predicates:
            - Path=/api/v1/documents/**
          filters:
            # Rate limit document uploads (POST) per user
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@redisRateLimiter}"
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: ${smarthire.gateway.rate-limits.document.replenish:10}
                redis-rate-limiter.burstCapacity: ${smarthire.gateway.rate-limits.document.burst:20}
                redis-rate-limiter.requestedTokens: 1
            - name: SetResponseHeader
              args:
                name: X-RateLimit-Policy
                value: "user:10rps/20burst"
        # Notification-service route. Candidate-facing notification endpoints require authentication
        # (enforced by GatewaySecurityConfig deny-by-default). No rate limiting for now.
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notifications/**
        # AI service route. All AI endpoints require authentication (enforced by
        # GatewaySecurityConfig deny-by-default). Kill switch handled by AI service itself.
        - id: ai-service
          uri: lb://AI-SERVICE
          predicates:
            - Path=/api/v1/ai/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: '*'
            allowCredentials: true
            maxAge: 3600

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

# Edge JWT verification (GatewaySecurityConfig). jwk-set-uri is a direct HTTP URL to the
# auth-service JWKS — deliberately NOT lb://, since the reactive decoder's key fetch bypasses the
# gateway's load-balancer filter. issuer/audience mirror the values auth-service signs (ADR-0009).
smarthire:
  gateway:
    jwt:
      jwk-set-uri: ${GATEWAY_JWK_SET_URI:http://localhost:8082/oauth2/jwks}
      issuer: ${AUTH_JWT_ISSUER:https://smarthire.local/auth}
      audience: ${AUTH_JWT_AUDIENCE:smarthire}

# Springdoc Swagger UI configuration for Gateway aggregation
springdoc:
  swagger-ui:
    urls:
      - name: Job Service
        url: /v3/api-docs/job-service
      - name: Auth Service
        url: /v3/api-docs/auth-service
      - name: Application Service
        url: /v3/api-docs/application-service
      - name: Recruitment Service
        url: /v3/api-docs/recruitment-service
      - name: Document Service
        url: /v3/api-docs/document-service
      - name: Notification Service
        url: /v3/api-docs/notification-service
    # Disable the default petstore URL
    disable-swagger-default-url: true
  api-docs:
    # Gateway's own API docs path (enabled for health/monitoring)
    enabled: true
    path: /v3/api-docs