spring:
  application:
    name: job-service
  datasource:
    url: ${JOB_SVC_DB_URL:jdbc:postgresql://localhost:5432/smarthire}
    username: ${JOB_SVC_DB_USER:smarthire}
    # No default: the password must be supplied via the environment (governance §17 — no secrets in config).
    password: ${JOB_SVC_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: job_svc
  flyway:
    enabled: true
    schemas: job_svc
    default-schema: job_svc
    create-schemas: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
