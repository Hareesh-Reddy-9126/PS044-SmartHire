spring:
  application:
    name: job-service
  datasource:
    url: ${JOB_SVC_DB_URL:jdbc:postgresql://localhost:5432/smarthire}
    username: ${JOB_SVC_DB_USER:smarthire}
    # No default: the password must be supplied via the environment (governance §17 — no secrets in config).
    password: ${JOB_SVC_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: job_svc
  flyway:
    enabled: true
    schemas: job_svc
    default-schema: job_svc
    create-schemas: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8081

# Resource-server JWT verification (ADR-0009, decision 4 — defense-in-depth behind the gateway).
# Mirrors the gateway's offline verification: keys are fetched from the auth-service JWKS over a
# direct HTTP URL (not lb://, the decoder's key fetch does not pass through the load balancer), and
# iss/aud are pinned to the values auth-service signs, so a token minted for another audience is
# rejected here too.
smarthire:
  job:
    jwt:
      jwk-set-uri: ${JOB_JWK_SET_URI:http://localhost:8082/oauth2/jwks}
      issuer: ${AUTH_JWT_ISSUER:https://smarthire.local/auth}
      audience: ${AUTH_JWT_AUDIENCE:smarthire}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
