# Test local profile for AI Service unit tests.
# Overrides the production/local datasource so tests can run without PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:ai_svc_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS ai_svc
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: ai_svc
  flyway:
    enabled: false

smarthire:
  ai:
    enabled: true
    provider: mock

management:
  endpoints:
    web:
      exposure:
        include: health,info
