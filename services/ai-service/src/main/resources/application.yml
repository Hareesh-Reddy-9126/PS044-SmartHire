spring:
  application:
    name: ai-service
  datasource:
    url: ${AI_SVC_DB_URL:jdbc:postgresql://postgres:5432/smarthire}
    username: ${AI_SVC_DB_USER:postgres}
    password: ${AI_SVC_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ai_svc
  flyway:
    enabled: true
    schemas: ai_svc
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

server:
  port: 8087

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://service-registry:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

# Edge JWT verification (consistent with other services).
# jwk-set-uri is a direct HTTP URL to the auth-service JWKS.
smarthire:
  ai:
    jwt:
      jwk-set-uri: ${AI_JWK_SET_URI:http://auth-service:8082/oauth2/jwks}
      issuer: ${AUTH_JWT_ISSUER:https://smarthire.local/auth}
      audience: ${AUTH_JWT_AUDIENCE:smarthire}
    # Feature flag to disable AI endpoints without disabling core workflows (governance §49).
    enabled: ${AI_ENABLED:true}
    # Provider configuration — "mock" for local/dev, "claude" for production (requires secret).
    provider: ${AI_PROVIDER:mock}
    # Provider-specific settings (model, max tokens, temperature).
    claude:
      model: ${AI_CLAUDE_MODEL:claude-3-haiku-20240307}
      max-tokens: ${AI_CLAUDE_MAX_TOKENS:1024}
      temperature: ${AI_CLAUDE_TEMPERATURE:0.1}
      api-key: ${AI_CLAUDE_API_KEY:}  # Must be set in production via secret injection

# Springdoc OpenAPI configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# Resilience4j configuration for inter-service Feign calls
resilience4j:
  circuitbreaker:
    instances:
      applicationService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
      jobService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
      documentService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
  retry:
    instances:
      applicationService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
          - feign.FeignException
      jobService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
          - feign.FeignException
      documentService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
          - feign.FeignException
  bulkhead:
    instances:
      applicationService:
        maxConcurrentCalls: 20
        maxWaitDuration: 0
      jobService:
        maxConcurrentCalls: 20
        maxWaitDuration: 0
      documentService:
        maxConcurrentCalls: 20
        maxWaitDuration: 0