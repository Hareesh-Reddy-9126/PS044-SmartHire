# Production profile overrides for AI Service
# Activates when 'prod' profile is active: --spring.profiles.active=prod

spring:
  datasource:
    url: ${AI_SVC_DB_URL}
    username: ${AI_SVC_DB_USER}
    password: ${AI_SVC_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ai_svc

smarthire:
  ai:
    jwt:
      jwk-set-uri: ${AI_JWK_SET_URI}
      issuer: ${AUTH_JWT_ISSUER}
      audience: ${AUTH_JWT_AUDIENCE}
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:claude}
    claude:
      model: ${AI_CLAUDE_MODEL:claude-3-haiku-20240307}
      max-tokens: ${AI_CLAUDE_MAX_TOKENS:1024}
      temperature: ${AI_CLAUDE_TEMPERATURE:0.1}
      api-key: ${AI_CLAUDE_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}